- name: Install Android SDK Build Tools (AIDL)
  shell: bash
  run: |
    set -e

    export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
    export ANDROID_SDK_ROOT="$ANDROID_HOME"

    SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

    yes | "$SDKMANAGER" --licenses || true

    "$SDKMANAGER" \
      "platform-tools" \
      "platforms;android-35" \
      "build-tools;35.0.0"

    echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

    # Verify AIDL is installed
    test -x "$ANDROID_HOME/build-tools/35.0.0/aidl"

    "$ANDROID_HOME/build-tools/35.0.0/aidl" --version || true

    echo "AIDL installed successfully"
