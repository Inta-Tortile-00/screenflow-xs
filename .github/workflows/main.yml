name: Build ScreenFlow Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Use Python 3.11 for Buildozer
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config build-essential cmake libffi-dev libssl-dev zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5

      - name: Install Buildozer in isolated Python 3.11 environment
        run: |
          python -m venv --system-site-packages "$HOME/screenflow-build-venv"
          echo "$HOME/screenflow-build-venv/bin" >> "$GITHUB_PATH"
          "$HOME/screenflow-build-venv/bin/python" -m pip install --upgrade 'pip==24.0' 'setuptools<75' wheel
          "$HOME/screenflow-build-venv/bin/python" -m pip install 'buildozer==1.5.0' 'cython==0.29.34'
          "$HOME/screenflow-build-venv/bin/python" -m site
          "$HOME/screenflow-build-venv/bin/python" --version
          "$HOME/screenflow-build-venv/bin/buildozer" --version

      - name: Build debug APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log
          test -n "$(find bin -maxdepth 1 -name '*.apk' -print -quit)"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: screenflow-xs-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenflow-build-log
          path: build.log
          if-no-files-found: ignore
