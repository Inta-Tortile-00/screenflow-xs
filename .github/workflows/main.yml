name: Build ScreenFlow Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip python3-venv python3-dev \
            autoconf automake libtool pkg-config build-essential cmake libffi-dev libssl-dev \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5

      - name: Install Buildozer and Cython
        run: |
          python3 -m pip install --user --upgrade pip setuptools wheel
          python3 -m pip install --user buildozer 'cython<3'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          yes | buildozer -v android debug 2>&1 | tee build.log
          test -n "$(find bin -maxdepth 1 -name '*.apk' -print -quit)"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: screenflow-xs-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenflow-build-log
          path: build.log
          if-no-files-found: ignore
