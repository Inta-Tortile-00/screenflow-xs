name: Build ScreenFlow Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config build-essential cmake libffi-dev libssl-dev zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5
      - name: Verify Android SDK and AIDL
        shell: bash
        run: |
          set -e

          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "SDK directory: $ANDROID_HOME"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "platform-tools"

          AIDL="$ANDROID_HOME/build-tools/33.0.2/aidl"

          if [ ! -x "$AIDL" ]; then
            echo "ERROR: AIDL missing from Android SDK"
            exit 1
          fi

          echo "AIDL executable found: $AIDL"
          ls -l "$AIDL"
                - name: Fix legacy SDK paths for Buildozer
          shell: bash
          run: |
          set -e

          SDK=/usr/local/lib/android/sdk

          test -x "$SDK/cmdline-tools/latest/bin/sdkmanager"

          mkdir -p "$SDK/tools/bin"

          cat > "$SDK/tools/bin/sdkmanager" <<'EOF'
          #!/bin/bash
          exec /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/usr/local/lib/android/sdk "$@"
          EOF

          chmod +x "$SDK/tools/bin/sdkmanager"

          "$SDK/tools/bin/sdkmanager" --version

          echo "Legacy SDK compatibility established."
      - name: Install Python build tools
        run: |
          python -m pip install --upgrade 'pip==24.0' 'setuptools<75' 'wheel==0.43.0'
          python -m pip install --user 'buildozer==1.5.0' 'cython==0.29.34'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure Android SDK and legacy compatibility
        shell: bash
        run: |
          set -e

          SDK=/usr/local/lib/android/sdk
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          "$SDKMANAGER" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "platform-tools"

          test -x "$SDK/build-tools/33.0.2/aidl"

          mkdir -p "$SDK/tools/bin"

          printf '%s\n' \
            '#!/bin/bash' \
            'exec /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/usr/local/lib/android/sdk "$@"' \
            > "$SDK/tools/bin/sdkmanager"

          chmod +x "$SDK/tools/bin/sdkmanager"

          "$SDK/tools/bin/sdkmanager" --version

          echo "Android SDK verification successful."

      - name: Build Android APK
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          buildozer -v android debug
      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log
          test -n "$(find bin -maxdepth 1 -name '*.apk' -print -quit)"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: screenflow-xs-debug-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload log if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenflow-build-log
          path: build.log
          if-no-files-found: ignore
