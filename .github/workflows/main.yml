
    
  
name: Build ScreenFlow Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev build-essential ccache

      - name: Install Python build dependencies
        run: |
          python -m pip install --user 'pip==24.0' 'setuptools<75' 'wheel==0.43.0' 'buildozer==1.5.0' 'Cython==0.29.34'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e
          SDK="$ANDROID_HOME"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.1.8937393"
          test -x "$SDK/build-tools/33.0.2/aidl"
          mkdir -p "$SDK/tools/bin"
          printf '%s\n' '#!/bin/bash' 'exec /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/usr/local/lib/android/sdk "$@"' > "$SDK/tools/bin/sdkmanager"
          chmod +x "$SDK/tools/bin/sdkmanager"
          "$SDK/tools/bin/sdkmanager" --version
          echo "$SDK/build-tools/33.0.2" >> "$GITHUB_PATH"
          ls -l "$SDK/build-tools/33.0.2/aidl"

      - name: Verify build environment
        run: |
          python --version
          python -m pip --version
          java -version
          test -x "$JAVA_HOME/bin/javac"
          buildozer --version
          test -f buildozer.spec
          test -f main.py

      - name: Build Android APK
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: screenflow-xs-debug-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenflow-build-log
          path: build.log
          if-no-files-found: ignore

