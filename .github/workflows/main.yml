name: Build ScreenFlow Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Use Python 3.11 for Buildozer
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config build-essential cmake libffi-dev libssl-dev zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5

      - name: Install Android SDK Build Tools (AIDL)
      shell: bash
run: |
    set -e

    export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
    export ANDROID_SDK_ROOT="$ANDROID_HOME"

    SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

    yes | "$SDKMANAGER" --licenses || true

    "$SDKMANAGER" \
      "platform-tools" \
      "platforms;android-35" \
      "build-tools;35.0.0"

    echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

    # Verify AIDL is installed
    test -x "$ANDROID_HOME/build-tools/35.0.0/aidl"

    "$ANDROID_HOME/build-tools/35.0.0/aidl" --version || true

    echo "AIDL installed successfully"
    
      - name: Install Buildozer using Python 3.11 (no venv)
        run: |
          python -m pip install --upgrade 'pip==24.0' 'setuptools<75' 'wheel==0.43.0'
          python -m pip install --user 'buildozer==1.5.0' 'cython==0.29.34'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          python -m site
          python --version
          "$HOME/.local/bin/buildozer" --version

      - name: Build debug APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log
          test -n "$(find bin -maxdepth 1 -name '*.apk' -print -quit)"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: screenflow-xs-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenflow-build-log
          path: build.log
          if-no-files-found: ignore
