name: Build ScreenFlow Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config build-essential cmake libffi-dev libssl-dev zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5
      - name: Verify Android SDK and AIDL
        shell: bash
        run: |
          set -e

          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "SDK directory: $ANDROID_HOME"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "platform-tools"

          AIDL="$ANDROID_HOME/build-tools/33.0.2/aidl"

          if [ ! -x "$AIDL" ]; then
            echo "ERROR: AIDL missing from Android SDK"
            exit 1
          fi

          echo "AIDL executable found: $AIDL"
          ls -l "$AIDL"
      - name: Install Python build tools
        run: |
          python -m pip install --upgrade 'pip==24.0' 'setuptools<75' 'wheel==0.43.0'
          python -m pip install --user 'buildozer==1.5.0' 'cython==0.29.34'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK tools and AIDL
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          "$SDKMANAGER" --sdk_root="$SDK" 'platform-tools' 'platforms;android-33' 'build-tools;33.0.2'
          AIDL="$SDK/build-tools/33.0.2/aidl"
          test -x "$AIDL"
          echo "$SDK/build-tools/33.0.2" >> "$GITHUB_PATH"
          echo "AIDL found at $AIDL"
      - name: Verify Java installation
        shell: bash
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version
          test -x "$JAVA_HOME/bin/java"
          test -x "$JAVA_HOME/bin/javac"
      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log
          test -n "$(find bin -maxdepth 1 -name '*.apk' -print -quit)"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: screenflow-xs-debug-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload log if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenflow-build-log
          path: build.log
          if-no-files-found: ignore
